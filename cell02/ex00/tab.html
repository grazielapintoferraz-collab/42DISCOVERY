<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Tabelas</title>

    <style>
        body {
            margin: 0;
        }

        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            width: 50%;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            color: blue;
            border: 2px solid black;
        }

        .celula-amarela {
            background-color: yellow;
        }

        .celula-verde {
            background-color: green;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="celula-amarela">Amarelo</td>
            <td class="celula-verde">Verde</td>
        </tr>
    </table>
</body>

</html>
